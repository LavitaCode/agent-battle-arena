name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mode-a-backend: ${{ steps.filter.outputs.mode-a-backend }}
      mode-a-frontend: ${{ steps.filter.outputs.mode-a-frontend }}
      mode-b-live: ${{ steps.filter.outputs.mode-b-live }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mode-a-backend:
              - 'backend/**'
              - 'requirements.txt'
              - 'quests/**'
              - '.github/workflows/ci.yml'
            mode-a-frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mode-b-live:
              - 'backend-live/**'
              - 'unity/**'
              - '.github/workflows/ci.yml'

  backend-tests:
    name: Backend tests (Python · Modo A)
    needs: changes
    if: needs.changes.outputs.mode-a-backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CQA_DATABASE_URL: postgresql://arena:arena@localhost:5432/arena_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQLite + PostgreSQL)
        run: python -m unittest discover -s backend/tests -p "test_*.py"

  frontend-build:
    name: Frontend build (Angular · Modo A)
    needs: changes
    if: needs.changes.outputs.mode-a-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  backend-live-tests:
    name: Backend Live tests (.NET · Modo B)
    needs: changes
    if: needs.changes.outputs.mode-b-live == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: backend-live
        run: dotnet restore

      - name: Build
        working-directory: backend-live
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: backend-live
        run: dotnet test --no-build --configuration Release --verbosity normal
